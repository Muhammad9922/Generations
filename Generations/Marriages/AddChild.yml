info:
  name: Add Child
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/marriages/<marriage-id>/children
  body:
    type: json
    data: '{ "childId": "<child-id>" }'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
